<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTSP 语音转文字</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1e293b;
    padding: 12px 24px;
    border-bottom: 1px solid #334155;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  .status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    background: #334155;
  }
  .status.connected { background: #166534; }
  .status.disconnected { background: #991b1b; }

  main {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 16px;
    overflow: hidden;
  }

  .live-panel {
    flex: 1;
    background: #1e293b;
    border-radius: 8px;
    border: 1px solid #334155;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-title {
    padding: 12px 16px;
    border-bottom: 1px solid #334155;
    font-weight: 600;
    font-size: 14px;
    color: #94a3b8;
  }
  .live-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .live-item {
    margin-bottom: 16px;
    padding: 12px 16px;
    background: #0f172a;
    border-left: 3px solid #3b82f6;
    border-radius: 4px;
    animation: fadeIn 0.3s ease;
  }
  .live-item .time {
    font-size: 11px;
    color: #64748b;
    margin-bottom: 4px;
  }
  .live-item .text {
    font-size: 16px;
    line-height: 1.6;
    word-break: break-word;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .history-panel {
    width: 400px;
    background: #1e293b;
    border-radius: 8px;
    border: 1px solid #334155;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .history-search {
    padding: 12px 16px;
    border-bottom: 1px solid #334155;
  }
  .history-search input {
    width: 100%;
    padding: 8px 12px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 4px;
    color: #e2e8f0;
    font-size: 13px;
    outline: none;
  }
  .history-search input:focus { border-color: #3b82f6; }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .history-item {
    padding: 10px 16px;
    border-bottom: 1px solid #334155;
    cursor: pointer;
    transition: background 0.15s;
  }
  .history-item:hover { background: #334155; }
  .history-item .time {
    font-size: 11px;
    color: #64748b;
    margin-bottom: 2px;
  }
  .history-item .text {
    font-size: 13px;
    color: #cbd5e1;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

  .empty {
    color: #64748b;
    text-align: center;
    padding: 40px 16px;
    font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>🎙️ RTSP 语音转文字</h1>
  <span id="status" class="status disconnected">未连接</span>
</header>
<main>
  <div class="live-panel">
    <div class="panel-title">实时字幕</div>
    <div id="live-content" class="live-content">
      <div class="empty">等待语音输入...</div>
    </div>
  </div>

  <div class="history-panel">
    <div class="panel-title">历史记录</div>
    <div class="history-search">
      <input id="search" type="text" placeholder="搜索历史记录..." />
    </div>
    <div id="history-list" class="history-list"></div>
  </div>
</main>

<script>
const liveContent = document.getElementById('live-content');
const historyList = document.getElementById('history-list');
const statusEl = document.getElementById('status');
const searchInput = document.getElementById('search');

let ws = null;
let searchTimer = null;

function setStatus(connected) {
  statusEl.textContent = connected ? '已连接' : '未连接';
  statusEl.className = 'status ' + (connected ? 'connected' : 'disconnected');
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => setStatus(true);
  ws.onclose = () => {
    setStatus(false);
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => setStatus(false);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'transcript') {
      addLiveItem(msg);
      prependHistoryItem(msg);
    }
  };
}

function fmtTime(iso) {
  if (!iso) return new Date().toLocaleTimeString('zh-CN');
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', { hour12: false });
}

function addLiveItem(msg) {
  const empty = liveContent.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'live-item';
  div.innerHTML = `
    <div class="time">${fmtTime(msg.timestamp)}</div>
    <div class="text"></div>
  `;
  div.querySelector('.text').textContent = msg.text;
  liveContent.appendChild(div);
  liveContent.scrollTop = liveContent.scrollHeight;
}

function prependHistoryItem(msg) {
  const div = document.createElement('div');
  div.className = 'history-item';
  div.innerHTML = `
    <div class="time">${fmtTime(msg.timestamp)}</div>
    <div class="text"></div>
  `;
  div.querySelector('.text').textContent = msg.text;
  historyList.insertBefore(div, historyList.firstChild);
}

async function loadHistory(keyword = '') {
  try {
    const res = await fetch(`/api/transcripts?limit=100&keyword=${encodeURIComponent(keyword)}`);
    const data = await res.json();
    historyList.innerHTML = '';
    if (!data.items.length) {
      historyList.innerHTML = '<div class="empty">暂无记录</div>';
      return;
    }
    data.items.forEach(item => prependHistoryItem(item));
  } catch (e) {
    historyList.innerHTML = '<div class="empty">加载失败</div>';
  }
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadHistory(searchInput.value.trim()), 300);
});

// 初始化
connectWS();
loadHistory();
</script>
</body>
</html>
