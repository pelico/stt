services:
  stt:
    image: ghcr.io/pelico/stt:latest
    container_name: rtsp-stt
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 识别时段与日志时间戳都按容器本地时间，不设会用 UTC（差 8 小时）
      - TZ=Asia/Shanghai
      - RTSP_URL=rtsp://192.168.1.100:8554/live
      # 三选一：aliyun / tencent / openai（也可启动后在 Web 设置页修改）
      - ASR_ENGINE=aliyun
      - DASHSCOPE_API_KEY=your_api_key_here
      # 可选访问口令：设置后用 ?token=xxx 打开一次页面即可
      # - ACCESS_TOKEN=change-me
      # 识别队列：默认「完整优先」，语音段落盘 ./data/pending.db，ASR 慢时后台补识别不丢数据
      # 要低延迟（宁可丢旧片段）改成 realtime；切换后需重启容器
      # - QUEUE_MODE=realtime
      # - QUEUE_MAX_ITEMS=2000
      # - QUEUE_MAX_MB=256
      # 段合并：相邻段（间隔 <2s）合并成一次识别请求，摊薄固定开销，吞吐翻 2~3 倍
      # 也可启动后在 Web 设置页调整（保存即生效）
      # - ASR_MERGE_GAP_SEC=2.0
      # - ASR_MERGE_MAX_SEC=30
      # ffmpeg 轻度降噪（afftdn），老 ffmpeg 无该滤镜时自动关闭
      # - FFMPEG_DENOISE=1
      # 诊断：连接/读取超时分开、慢请求阈值；完整日志轮转落盘 ./data/logs/stt.log
      # - ASR_CONNECT_TIMEOUT=10
      # - ASR_SLOW_MS=10000
      # - LOG_FILE_ENABLED=true
      # 被过滤音频留证（调试用）
      # - SAVE_REJECTED_AUDIO=true
      # - TENCENT_SECRET_ID=
      # - TENCENT_SECRET_KEY=
      # - OPENAI_BASE_URL=https://api.openai.com/v1
      # - OPENAI_API_KEY=
      - VAD_MODE=3
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
    # 如果 RTSP 服务在宿主机上，可改用 host 网络
    # network_mode: host
