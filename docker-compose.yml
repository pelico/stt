services:
  stt:
    image: ghcr.io/pelico/stt:latest
    container_name: rtsp-stt
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 识别时段与日志时间戳都按容器本地时间，不设会用 UTC（差 8 小时）
      - TZ=Asia/Shanghai
      - RTSP_URL=rtsp://192.168.1.100:8554/live
      # 三选一：aliyun / tencent / openai（也可启动后在 Web 设置页修改）
      - ASR_ENGINE=aliyun
      - DASHSCOPE_API_KEY=your_api_key_here
      # 可选访问口令：设置后用 ?token=xxx 打开一次页面即可
      # - ACCESS_TOKEN=change-me
      # 被过滤音频留证（调试用）
      # - SAVE_REJECTED_AUDIO=true
      # - TENCENT_SECRET_ID=
      # - TENCENT_SECRET_KEY=
      # - OPENAI_BASE_URL=https://api.openai.com/v1
      # - OPENAI_API_KEY=
      - VAD_MODE=3
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
    # 如果 RTSP 服务在宿主机上，可改用 host 网络
    # network_mode: host
