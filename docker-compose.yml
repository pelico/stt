services:
  stt:
    image: ghcr.io/pelico/stt:latest
    container_name: rtsp-stt
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RTSP_URL=rtsp://192.168.1.100:8554/live
      # 三选一：aliyun / tencent / openai（也可启动后在 Web 设置页修改）
      - ASR_ENGINE=aliyun
      - DASHSCOPE_API_KEY=your_api_key_here
      # - TENCENT_SECRET_ID=
      # - TENCENT_SECRET_KEY=
      # - OPENAI_BASE_URL=https://api.openai.com/v1
      # - OPENAI_API_KEY=
      - VAD_MODE=3
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
    # 如果 RTSP 服务在宿主机上，可改用 host 网络
    # network_mode: host
